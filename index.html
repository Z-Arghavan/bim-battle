<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIM Battle</title>
<style>
/* Layout: one column on phones, two columns on the teacher's projector screen.
   Look: a drawing sheet. Faint grid paper, title block, dimension line as the timer. */
:root{
  --ink:#0d2a4f; --ink2:#344b67; --ink3:#566a82;
  --paper:#f3f7fc; --card:#ffffff; --line:#c9d9ec; --line2:#e2eaf5;
  --blue:#005ec4; --blueD:#034a96; --blueT:#eef5ff; --blueT2:#d6e7fb;
  --amber:#f5a623; --amberT:#fff3d5; --amberInk:#6a3b12;
  --good:#14834d; --goodT:#d5f5e4; --goodInk:#075b35;
  --bad:#c8413e; --badT:#ffe2e1; --badInk:#872d2b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Arial,Helvetica,sans-serif;
  font-family:var(--sans); color:var(--ink); font-size:18px; line-height:1.4;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(rgba(0,94,196,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,94,196,.07) 1px,transparent 1px);
  background-size:32px 32px; touch-action:manipulation;
}
[hidden]{display:none!important}
.shell{max-width:1000px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(56px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:20px;align-content:start}
.shell.wide{max-width:1280px}
.shell.narrow{max-width:640px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.7rem,8vw,4.8rem);line-height:1.02;letter-spacing:-.045em;color:var(--ink)}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.2;color:var(--ink)}
h3{font-size:1.2rem;color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--blue);font-weight:700;text-transform:uppercase}
.lead{font-size:1.2rem;color:var(--ink2);max-width:34em}
.hero{display:grid;gap:10px;padding:18px 0 4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 10px 28px rgba(23,55,91,.08);display:grid;gap:16px;align-content:start;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2>*{min-width:0}
.stack{display:grid;gap:20px;align-content:start}
label{display:block;font-weight:700;font-size:1rem;margin-bottom:8px}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #6685a9;background:#fff;color:var(--ink);font:inherit;font-size:1.2rem}
input#code{font-family:var(--mono);letter-spacing:.3em;font-size:1.5rem}
.btn{cursor:pointer;background:var(--blue);color:#fff;font:inherit;font-size:1.15rem;font-weight:700;border:3px solid transparent;border-radius:12px;padding:14px 22px;min-height:60px;width:100%;transition:background .15s}
.btn:hover:not(:disabled){background:var(--blueD)}
.btn:disabled{background:#9db4cf;cursor:default}
.btn.secondary{background:#e5edf8;color:#123b72;border-color:#9bb4d2}
.btn.secondary:hover:not(:disabled){background:#d2e2f6}
.btn.ghost{justify-self:center;background:transparent;color:var(--blueD);border-color:transparent;text-decoration:underline;min-height:44px;width:auto;padding:8px 10px;font-size:1rem}
.btn.big{min-height:76px;font-size:1.35rem}
.btn.small{min-height:44px;font-size:1rem;padding:8px 14px;width:auto}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:5px solid var(--amber);outline-offset:3px}
.err{color:var(--badInk);font-weight:700;min-height:1.4em}
.hint{font-size:.95rem;color:var(--ink3);line-height:1.5}
.warnbox{background:var(--amberT);color:var(--amberInk);padding:14px;border-radius:12px;font-weight:700;font-size:.98rem}
.steps{margin:0;padding-left:1.3em;display:grid;gap:8px;color:var(--ink2)}
.steps code,.hint code,pre{font-family:var(--mono);font-size:.88em;background:var(--blueT);padding:2px 6px;border-radius:6px}
pre{padding:12px;overflow-x:auto;margin:8px 0 0;white-space:pre}
details summary{cursor:pointer;font-weight:700;color:var(--blueD)}
a{color:var(--blueD)}

/* title block */
.tb{display:flex;flex-wrap:wrap;border:2px solid var(--ink);background:#fff;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.tb>div{padding:8px 16px;border-right:2px solid var(--ink);min-width:0}
.tb>div:last-child{border-right:0}
.tb small{display:block;font-size:.62rem;color:var(--ink3)}
.tb b{font-size:1.15rem;font-weight:700}
.tb .brand{background:var(--ink);color:#fff}
.tb .brand small{color:#a9c1de}
.tb .grow{flex:1}
.chip{display:inline-block;font-family:var(--mono);font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--amberT);color:var(--amberInk)}

/* student top strip */
.stu-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-weight:700;color:var(--ink)}
.stu-top .who{font-size:1.1rem;overflow-wrap:anywhere;min-width:0}
.tag{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blueD)}

/* progress and dimension-line timer */
.prog{height:12px;background:var(--line2);border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--blue);transition:width .25s}
.dimrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}
.dim{position:relative;height:22px}
.dim::before,.dim::after{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
.dim::before{left:0}.dim::after{right:0}
.dim .track{position:absolute;left:3px;right:3px;top:50%;height:8px;margin-top:-4px;background:var(--line2);border-radius:4px;overflow:hidden}
.dim .fill{height:100%;background:var(--blue);transition:width .25s linear,background .25s}
.dim .fill.mid{background:var(--amber)}
.dim .fill.low{background:var(--bad)}
.timenum{font-family:var(--mono);font-weight:700;font-size:1.4rem;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}

/* questions and options */
.q{font-size:clamp(1.5rem,4.2vw,2.3rem);line-height:1.22;text-wrap:balance}
.host .q{font-size:clamp(1.9rem,3.8vw,3.2rem)}
.opts{display:grid;gap:14px}
.host .opts{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;background:var(--blueT);color:#15345c;border:3px solid #8fb1db;border-radius:14px;padding:16px 18px;min-height:78px;font:inherit;font-size:1.2rem;font-weight:700;line-height:1.3;width:100%}
.opt:hover:not(:disabled){background:var(--blueT2);border-color:var(--blue)}
.opt .key{flex:none;display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:8px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:1.1rem}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .count{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.3rem}
.opt.static{cursor:default}
.opt.right{background:var(--goodT);border-color:var(--good);color:var(--goodInk)}
.opt.right .key{background:var(--good)}
.opt.dimmed{opacity:.55}
.host .opt{min-height:96px;font-size:1.45rem}

/* result panel on phones */
.result{border-radius:14px;padding:18px;display:grid;gap:4px}
.result b{font-size:1.6rem}
.result.good{background:var(--goodT);color:var(--goodInk)}
.result.bad{background:var(--badT);color:var(--badInk)}
.result.none{background:var(--amberT);color:var(--amberInk)}
.why{font-size:1.1rem;color:var(--ink2);line-height:1.5}
.bigmark{font-size:3rem;line-height:1}
.center{text-align:center;justify-items:center}

/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lb li{position:relative;display:grid;grid-template-columns:2.4em 1fr auto;gap:12px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--blueT);overflow:hidden;border:0;font-weight:700}
.lb .bar{position:absolute;inset:0 auto 0 0;background:var(--blueT2);z-index:0;transition:width .4s}
.lb li>:not(.bar){position:relative;z-index:1}
.lb .rk{font-family:var(--mono);color:var(--blueD)}
.lb .nm{overflow-wrap:anywhere;min-width:0}
.lb .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lb li.me{outline:3px solid var(--blue)}
.host .lb li{padding:14px 18px;font-size:1.3rem}

/* players */
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.pl{display:inline-flex;align-items:center;gap:8px;background:var(--blueT);border:2px solid #8fb1db;border-radius:999px;padding:6px 8px 6px 16px;font-weight:700;max-width:100%}
.pl span{overflow-wrap:anywhere;min-width:0}
.pl button{cursor:pointer;border:0;background:#fff;color:var(--ink2);border-radius:50%;width:30px;height:30px;font:inherit;font-weight:700;line-height:1}
.pl button:hover{background:var(--badT);color:var(--badInk)}

/* join card on host screen */
.qrcard{justify-items:center;text-align:center}
.qrbox{width:min(100%,380px,44vh);aspect-ratio:1;background:#fff;border-radius:12px;border:2px solid var(--line);padding:6px}
.qrbox svg{display:block;width:100%;height:100%}
.code{font-family:var(--mono);font-weight:700;font-size:clamp(2.6rem,min(8vw,11vh),5.2rem);letter-spacing:.18em;line-height:1;padding-left:.18em;color:var(--ink)}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;min-height:260px}
.podium>div{display:grid;gap:4px;justify-items:center;align-content:start;text-align:center;padding:14px 10px;border-radius:14px 14px 0 0;background:var(--blueT2);border:2px solid var(--line);border-bottom:0;min-width:0}
.podium .p1{min-height:240px;background:var(--ink);color:#fff;border-color:var(--ink)}
.podium .p2{min-height:190px}
.podium .p3{min-height:150px}
.podium b{font-size:clamp(1.1rem,2.6vw,1.8rem);overflow-wrap:anywhere;max-width:100%}
.podium .rk{font-family:var(--mono);font-size:2.2rem;font-weight:700}
.podium .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-weight:700;max-width:min(92vw,520px);z-index:20}

@media (max-width:760px){
  :root{font-size:17px}
  .grid2,.host .opts{grid-template-columns:1fr}
  .card{padding:20px}
  .tb>div{padding:6px 10px}
  .podium{min-height:0}
  .podium .p1,.podium .p2,.podium .p3{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="shell" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Settings you may want to change ---------- */
var LIMIT = 20;            // seconds per question
var BASE_PTS = 100;        // points for a correct answer
var BONUS_PTS = 50;        // extra points for a fast answer, scaled by the time left
var DEFAULT_DB = '';       // optional: paste your Firebase Realtime Database URL here so the QR code stays short
var ROOT = 'bimbattle';    // folder name inside the database
var QUESTION_COUNT = 2;    // how many questions a game uses, taken from the top of the list below (the list holds 10)

var ALL_QUESTIONS = [
  {q:'What does BIM stand for?',a:['Building Information Model','Building Information Management','Building Information Modelling','Building Information Monitoring'],correct:2,why:'In this lesson, BIM stands for Building Information Modelling. You may also hear Building Information Model (the digital model) and Building Information Management (managing information). Monitoring is not the standard expansion.'},
  {q:'Is BIM only a 3D picture of a building?',a:['Yes, it is only a picture','No, it can also contain information about building parts','Yes, but only for architects','No, it is only a list of costs'],correct:1,why:'A BIM model can show what a building looks like and hold useful information about its parts.'},
  {q:'You click on a door in a digital building model. What information might you find?',a:['Only its colour','Only the name of the architect','Its size, material and fire rating','Only the date the drawing was printed'],correct:2,why:'Building elements can have properties such as dimensions, materials and fire ratings.'},
  {q:'Why might architects and engineers share building information?',a:['To make the model look more colourful','To avoid discussing the project','To replace every site visit','To coordinate their work and reduce mistakes'],correct:3,why:'Shared information helps project teams understand the same building and coordinate decisions.'},
  {q:'What is an IFC file mainly used for?',a:['Exchanging model data between different software','Printing site photos','Editing video of a building site','Tracking worker attendance'],correct:0,why:'IFC (Industry Foundation Classes) is an open file format for BIM data. It lets teams who use different software share the same building information.'},
  {q:'What does clash detection find?',a:['Neighbours who object to a project','Colours that do not match','Errors in the project budget','Parts that collide, such as a duct running through a beam'],correct:3,why:'Clash detection compares the models of different disciplines and flags conflicts early, before they are built on site.'},
  {q:'What is a Common Data Environment (CDE)?',a:['A type of construction crane','A shared digital place for storing and exchanging project information','A building code for fire safety','A drawing tool for 2D plans only'],correct:1,why:'A CDE is an agreed shared place where the project team stores, shares and manages information, so everyone works from the latest approved version.'},
  {q:'Which international standard series describes information management using BIM?',a:['ISO 9001','ISO 14001','ISO 19650','ISO 45001'],correct:2,why:'ISO 19650 sets out how to manage information over the whole life of a built asset when using BIM. ISO 9001 covers quality management, ISO 14001 environmental management and ISO 45001 health and safety.'},
  {q:'In BIM, what does "4D" usually add to the 3D model?',a:['Time, such as the construction schedule','Cost','Sound','Colour'],correct:0,why:'4D links the model to time, so teams can see how construction progresses. 5D usually adds cost.'},
  {q:'Who can use the BIM model after the building is finished?',a:['Nobody, it is deleted at handover','Only the architect','Only the contractor','Facility managers, to support operation and maintenance'],correct:3,why:'Model information can be handed over and reused to operate and maintain the building, for example to find equipment and its details.'}
];
var QUESTIONS = ALL_QUESTIONS.slice(0, QUESTION_COUNT);

/* ---------- Small helpers ---------- */
var app = document.getElementById('app');
var DB_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/;
var qs = new URLSearchParams(location.search);
var store = {
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}}
};
function h(tag, props){
  var el = document.createElement(tag);
  if(props){ Object.keys(props).forEach(function(k){
    var v = props[k]; if(v==null||v===false) return;
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k.indexOf('on')===0) el.addEventListener(k.slice(2), v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }); }
  var kids = Array.prototype.slice.call(arguments,2).flat(Infinity);
  kids.forEach(function(kid){
    if(kid==null||kid===false) return;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  });
  return el;
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function fmt(n){ return Number(n||0).toLocaleString('en'); }
function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function num(v){ v=Number(v); return isFinite(v)&&v>0 ? Math.min(v,1e7) : 0; }
function cleanName(v){ return String(v||'').replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩]/g,'').replace(/\s+/g,' ').trim().slice(0,20); }
function cleanDb(v){
  v = String(v||'').trim(); if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v = 'https://'+v;
  try{ v = 'https://'+new URL(v).host; }catch(e){ return ''; }
  return DB_RE.test(v) ? v : '';
}
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 3500);
}
function show(wide){
  app.className = 'shell' + (wide==='wide' ? ' wide host' : wide==='narrow' ? ' narrow' : '');
  var nodes = Array.prototype.slice.call(arguments,1);
  app.replaceChildren.apply(app, nodes.flat(Infinity).filter(Boolean));
}

/* ---------- State ---------- */
var S = {
  role:null,             // 'host', 'student' or 'solo'
  db:'', room:'', pid:'',
  meta:null, players:{}, count:0, me:null,
  seen:{}, timedOut:{}, qStart:0,
  err:false, closed:false, busy:false, gen:0, memo:{}
};
function changed(k,v){ var s=JSON.stringify(v); if(S.memo[k]===s) return false; S.memo[k]=s; return true; }

/* ---------- Database (Firebase Realtime Database REST API) ---------- */
async function api(method, path, body, query){
  var opt = {method:method, cache:'no-store'};
  if(body!==undefined){ opt.body = JSON.stringify(body); opt.headers = {'Content-Type':'application/json'}; }
  if(window.AbortSignal && AbortSignal.timeout) opt.signal = AbortSignal.timeout(9000);
  var r = await fetch(S.db+'/'+path+'.json'+(query||''), opt);
  if(!r.ok){ var e = new Error('HTTP '+r.status); e.status = r.status; throw e; }
  return r.json();
}
async function fetchPlayers(){
  var p = await api('GET', ROOT+'/'+S.room+'/players');
  S.players = (p && typeof p==='object') ? p : {};
}
function standings(){
  var rows = Object.keys(S.players||{}).map(function(id){
    var p = S.players[id];
    if(!p || typeof p!=='object' || !p.name) return null;
    return {id:id, name:cleanName(p.name)||'Player', score:num(p.score), correct:num(p.correct), tms:num(p.tms), from:num(p.from), rec:p};
  }).filter(Boolean);
  if(S.role==='student' && S.me){
    rows.forEach(function(r){ if(r.id===S.pid){ r.score=S.me.score; r.correct=S.me.correct; r.tms=S.me.tms; } });
  }
  rows.sort(function(a,b){ return b.score-a.score || a.tms-b.tms || a.name.localeCompare(b.name); });
  return rows;
}
function answerOf(row,q){ var a=row.rec['a'+q]; return (a && Number.isInteger(a.c)) ? a : null; }
function connChip(){ return S.err ? h('span',{class:'chip',text:'Reconnecting'}) : null; }

/* ---------- QR code (inline library, no network needed) ---------- */
function qrSvg(text){
  var qr = qrcode(0,'M'); qr.addData(text); qr.make();
  var n = qr.getModuleCount(), m = 2, d = '';
  for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) d += 'M'+(c+m)+' '+(r+m)+'h1v1h-1z'; } }
  var ns = 'http://www.w3.org/2000/svg', size = n+2*m;
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+size+' '+size);
  svg.setAttribute('role','img'); svg.setAttribute('aria-label','QR code to join BIM Battle');
  svg.setAttribute('shape-rendering','crispEdges');
  var bg = document.createElementNS(ns,'rect'); bg.setAttribute('width',size); bg.setAttribute('height',size); bg.setAttribute('fill','#ffffff');
  var p = document.createElementNS(ns,'path'); p.setAttribute('d',d); p.setAttribute('fill','#0d2a4f');
  svg.append(bg,p);
  return h('div',{class:'qrbox'}, svg);
}
function joinUrl(){
  var u = location.origin + location.pathname + '?r=' + S.room;
  if(!cleanDb(DEFAULT_DB)) u += '&d=' + encodeURIComponent(S.db.replace('https://',''));
  return u;
}

/* ---------- Home ---------- */
function renderHome(){
  S.role = null;
  var fromQr = !!qs.get('r');
  var err = h('p',{class:'err',id:'joinErr',role:'alert'});
  var code = h('input',{id:'code',inputmode:'numeric',pattern:'[0-9]*',maxlength:'4',autocomplete:'off',placeholder:'0000',value:qs.get('r')||''});
  var name = h('input',{id:'name',maxlength:'20',autocomplete:'off',autocapitalize:'words',placeholder:'e.g. Sam',value:store.get('bb_name')||''});
  var go = h('button',{class:'btn',id:'joinBtn',type:'submit'},'Join the game');
  var form = h('form',{class:'card',onsubmit:async function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true;
    try{ await joinRoom(code.value.trim(), cleanName(name.value)); }
    catch(ex){ err.textContent = joinMessage(ex); }
    finally{ go.disabled=false; }
  }},
    h('h2',{text:'Join the game'}),
    h('div',null,h('label',{for:'code',text:'Room code'}),code),
    h('div',null,h('label',{for:'name',text:'Your name'}),name),
    go, err
  );
  var hero = h('header',{class:'hero'},
    h('span',{class:'eyebrow',text:'Live BIM quiz for the whole class'}),
    h('h1',{text:'BIM Battle'}),
    h('p',{class:'lead',text:fromQr ? 'Type your name and get ready. Everyone answers the same questions, and faster answers earn more points.' : 'Everyone answers the same questions on their own phone. Faster answers earn more points.'})
  );
  var side = null;
  if(!fromQr){
    var saved = store.get('bb_host');
    var resume = null;
    if(saved){ try{ var sh = JSON.parse(saved); if(sh && sh.room && cleanDb(sh.db)) resume = h('button',{class:'btn secondary',type:'button',onclick:function(){ resumeHost(sh); }},'Resume room '+sh.room); }catch(e){} }
    side = h('div',{class:'stack'},
      h('section',{class:'card'}, h('h3',{text:'Teaching the class?'}), h('p',{class:'hint',text:'Open this page on the projector. Students scan the QR code to join.'}), h('button',{class:'btn',type:'button',onclick:startHosting},'Host a class'), resume),

/* ---------- Joining as a student ---------- */
async function joinRoom(code, name){
  if(!/^\d{4}$/.test(code)) throw new Error('code');
  if(!name) throw new Error('name');
  S.db = cleanDb(qs.get('d')) || cleanDb(DEFAULT_DB) || cleanDb(store.get('bb_db'));
  if(!S.db) throw new Error('nodb');
  S.room = code;
  var meta = await api('GET', ROOT+'/'+code+'/meta');
  if(!meta) throw new Error('noroom');
  if(meta.phase==='ended') throw new Error('ended');
  var pid = store.get('bb_pid_'+code), rec = null, fresh = false;
  if(pid) rec = await api('GET', ROOT+'/'+code+'/players/'+pid);
  if(!rec){
    var others = await api('GET', ROOT+'/'+code+'/players') || {};
    var taken = Object.keys(others).map(function(k){ return others[k] && others[k].name ? String(others[k].name).toLowerCase() : ''; });
    var base = name, i = 2, finalName = name;
    while(taken.indexOf(finalName.toLowerCase())>=0){ finalName = base.slice(0,17)+' '+i; i++; }
    pid = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    var from = (meta.phase==='question'||meta.phase==='reveal') ? meta.q+1 : 0;
    rec = {name:finalName, score:0, correct:0, tms:0, from:from, t:Date.now()};
    fresh = true; store.del('bb_seen_'+code);
    await api('PUT', ROOT+'/'+code+'/players/'+pid, rec);
    store.set('bb_pid_'+code, pid);
  }
  store.set('bb_name', name);
  S.pid = pid; S.role = 'student'; S.meta = meta; S.closed = false;
  S.me = {name:cleanName(rec.name)||name, score:num(rec.score), correct:num(rec.correct), tms:num(rec.tms), from:num(rec.from), ans:{}};
  for(var q=0;q<QUESTIONS.length;q++){ var a = rec['a'+q]; if(a && Number.isInteger(a.c)) S.me.ans[q] = {c:a.c, ms:num(a.ms), p:num(a.p)}; }
  try{ S.seen = fresh ? {} : (JSON.parse(store.get('bb_seen_'+code)||'{}')||{}); }catch(e){ S.seen = {}; }
  S.timedOut = {}; S.players = {}; S.count = 0; S.memo = {};
  wakeLock();
  render();
  if(meta.phase==='reveal'||meta.phase==='ended') fetchPlayers().then(render,function(){});
  studentLoop(++S.gen);
}
function markSeen(q){
  if(S.seen[q]) return;
  S.seen[q] = Date.now();
  if(S.role==='student') store.set('bb_seen_'+S.room, JSON.stringify(S.seen));
}
var lobbyTick = 0;
async function studentLoop(gen){
  if(gen!==S.gen || S.role!=='student') return;
  try{
    var m = await api('GET', ROOT+'/'+S.room+'/meta');
    if(gen!==S.gen) return;
    S.err = false;
    if(!m){ if(!S.closed){ S.closed = true; render(); } }
    else if(!S.meta || m.n!==S.meta.n){
      S.meta = m; S.closed = false; render();
      if(m.phase==='reveal'||m.phase==='ended'){ try{ await fetchPlayers(); }catch(e){} render(); }
    }
    if(S.meta && S.meta.phase==='lobby' && (lobbyTick++ % 3===0)){
      var keys = await api('GET', ROOT+'/'+S.room+'/players', undefined, '?shallow=true');
      S.count = keys ? Object.keys(keys).length : 0;
      if(changed('lobbyN',S.count)) render();
    }
  }catch(e){ if(!S.err){ S.err = true; render(); } }
  setTimeout(function(){ studentLoop(gen); }, 1200);
}

function questionView(){
  var q = S.meta.q, Q = QUESTIONS[q];
  if(!inPlay(q)) return notice('Next question coming up','You joined during a round. You will play from the next question.');
  if(S.me.ans[q]) return notice('Answer locked in','Waiting for the others. Results appear when the host shows the answer.','✓');
  if(S.timedOut[q]) return notice('Time is up','Results appear when the host shows the answer.');
  markSeen(q);
  var left = Math.max(0, LIMIT-(Date.now()-S.seen[q])/1000);
  if(left<=0){ S.timedOut[q] = true; return notice('Time is up','Results appear when the host shows the answer.'); }
  return h('section',{class:'card'},
    h('div',{class:'prog'}, h('i',{style:'width:'+(q/QUESTIONS.length*100)+'%'})),
    h('h2',{class:'q',text:Q.q}),
    h('div',{class:'dimrow'}, h('div',{class:'dim'}, h('div',{class:'track'}, h('div',{class:'fill',id:'timeFill',style:'width:'+(left/LIMIT*100)+'%'}))), h('span',{class:'timenum',id:'timeNum',text:Math.ceil(left)+'s'})),
    h('div',{class:'opts'}, Q.a.map(function(t,i){
      return h('button',{class:'opt',type:'button',onclick:function(){ answer(i); }}, h('span',{class:'key',text:'ABCD'[i]}), h('span',{class:'txt',text:t}));
    }))
  );
}
function answer(i){
  var m = S.meta, q = m.q;
  if(S.me.ans[q] || S.timedOut[q] || !inPlay(q)) return;
  var spent = Math.min(LIMIT*1000, Date.now()-(S.seen[q]||Date.now()));
  if(spent >= LIMIT*1000) return;
  var ok = i===QUESTIONS[q].correct;
  var pts = ok ? BASE_PTS+Math.round(BONUS_PTS*(1-spent/(LIMIT*1000))) : 0;
  S.me.ans[q] = {c:i, ms:spent, p:pts};
  S.me.score += pts; S.me.tms += spent; if(ok) S.me.correct++;
  if(S.role==='solo'){ S.meta = Object.assign({}, m, {phase:'reveal'}); render(); return; }
  saveMe(); render();
}
var saving = false, dirty = false;
async function saveMe(){
  dirty = true; if(saving) return; saving = true;
  try{
    while(dirty){
      dirty = false;
      var body = {score:S.me.score, correct:S.me.correct, tms:S.me.tms};
      Object.keys(S.me.ans).forEach(function(q){ var a=S.me.ans[q]; body['a'+q] = {c:a.c, ms:a.ms, p:a.p}; });
      for(var t=0;t<6;t++){
        try{ await api('PATCH', ROOT+'/'+S.room+'/players/'+S.pid, body); S.err = false; break; }
        catch(e){ S.err = true; await sleep(700*(t+1)); }
      }
    }
  } finally { saving = false; }
}

function setupMessage(ex){

  if(ex && (ex.status===401 || ex.status===403)) return 'The database refused the request. Check that it is in test mode, or paste the rules from the box below.';
  if(ex && ex.status===404) return 'No database found at that address. Check the URL and try again.';

async function hostCreate(){

    if(ex===null){

      S.room = code; S.meta = meta; S.players = {}; S.role = 'host'; S.qStart = 0; S.memo = {}; S.err = false;

function hostQuestion(){
  var q = S.meta.q, Q = QUESTIONS[q], rows = standings();
  var active = rows.filter(function(r){ return r.from<=q; });
  var answered = active.filter(function(r){ return answerOf(r,q); }).length;
  var left = Math.max(0, LIMIT-(Date.now()-S.qStart)/1000);
  return h('section',{class:'card'},
    h('h2',{class:'q',text:Q.q}),
    h('div',{class:'opts'}, Q.a.map(function(t,i){
      return h('div',{class:'opt static'}, h('span',{class:'key',text:'ABCD'[i]}), h('span',{class:'txt',text:t}));
    })),
    h('div',{class:'dimrow'}, h('div',{class:'dim'}, h('div',{class:'track'}, h('div',{class:'fill',id:'timeFill',style:'width:'+(left/LIMIT*100)+'%'}))), h('span',{class:'timenum',id:'timeNum',text:Math.ceil(left)+'s'})),
    h('div',{class:'grid2'},
      h('p',{class:'why'}, h('b',{text:answered+' of '+active.length}), ' answered'),
      hostPrimary('Show answer')
    )
  );
}
function hostReveal(){
  var q = S.meta.q, Q = QUESTIONS[q], rows = standings();
  var active = rows.filter(function(r){ return r.from<=q; });
  var counts = [0,0,0,0];
  active.forEach(function(r){ var a = answerOf(r,q); if(a && a.c>=0 && a.c<4) counts[a.c]++; });
  var last = q+1>=QUESTIONS.length;
  var okCount = counts[Q.correct];
  return h('div',{class:'grid2'},
    h('section',{class:'card'},
      h('h2',{class:'q',text:Q.q}),
      h('div',{class:'opts',style:'grid-template-columns:1fr'}, Q.a.map(function(t,i){
        return h('div',{class:'opt static '+(i===Q.correct?'right':'dimmed')}, h('span',{class:'key',text:'ABCD'[i]}), h('span',{class:'txt',text:t}), h('span',{class:'count',text:String(counts[i])}));
      })),
      h('p',{class:'why',text:Q.why}),
      h('p',{class:'hint',text:okCount+' of '+active.length+' answered correctly.'})
    ),
    h('section',{class:'card'},
      h('h2',{text:'Top 5'}),
      leaderboard(rows.slice(0,5)),
      hostPrimary(last ? 'Show final results' : 'Next question')
    )
  );
}
function podiumCol(r, cls, rank){
  if(!r) return h('div',{class:cls,style:'visibility:hidden'});
  return h('div',{class:cls}, h('span',{class:'rk',text:String(rank)}), h('b',{text:r.name}), h('span',{class:'sc',text:fmt(r.score)+' pts'}));
}
function hostEnd(){
  var rows = standings(), ranks = {}; rows.forEach(function(r,i){ ranks[r.id]=i+1; });
  return h('div',{class:'grid2'},
    h('section',{class:'card'},
      h('h2',{text:'Final results'}),
      rows.length ? h('div',{class:'podium'}, podiumCol(rows[1],'p2',2), podiumCol(rows[0],'p1',1), podiumCol(rows[2],'p3',3)) : h('p',{class:'hint',text:'No players finished.'}),
      h('div',{class:'actions'},
        h('button',{class:'btn secondary',type:'button',onclick:downloadCsv},'Download results (CSV)'),
        h('button',{class:'btn',type:'button',onclick:newGame},'New game'),
        h('button',{class:'btn secondary',type:'button',onclick:closeRoom},'Close room and delete data')
      )
    ),
    h('section',{class:'card'}, h('h2',{text:'Everyone'}), leaderboard(rows.slice(0,12),{ranks:ranks}), rows.length>12 ? h('p',{class:'hint',text:'and '+(rows.length-12)+' more in the CSV'}) : null)
  );
}
function csvCell(v){
  v = String(v);
  if(/^[=+\-@\t\r]/.test(v)) v = "'"+v;
  return '"'+v.replace(/"/g,'""')+'"';
}
function downloadCsv(){
  var rows = standings();
  var lines = ['rank,name,score,correct,total_seconds'];
  rows.forEach(function(r,i){ lines.push([i+1, csvCell(r.name), r.score, r.correct, (r.tms/1000).toFixed(1)].join(',')); });
  var blob = new Blob([lines.join('\n')], {type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bim-battle-'+S.room+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ---------- Render dispatch and housekeeping ---------- */
function render(){
  if(S.role==='host') renderHost();
  else if(S.role==='student' || S.role==='solo') renderStudent();
  else renderHome();
}
async function wakeLock(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.role==='student') wakeLock(); });
document.addEventListener('keydown', function(e){
  if(S.role!=='host' || e.code!=='Space') return;
  var t = e.target && e.target.tagName; if(t==='INPUT'||t==='TEXTAREA') return;
  var b = document.getElementById('primary'); if(b && !b.disabled){ e.preventDefault(); primary(); }
});
setInterval(function(){ tickHost(); tickStudent(); }, 250);
renderHome();
})();
</script>
